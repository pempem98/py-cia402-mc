# Demo: one Maxon HEJ 70-48-60 joint, free-standing, no load.
# Datasheet: Datasheet_HEJ_70_48_60_rev1.0.pdf (preliminary, Sept 2025).
#
# KNOWN LIMITATION: the joint barely resists position error (measured ~1.6
# permille torque per degree), so moves beyond a few degrees trip the
# following-error limit. The datasheet describes an impedance controller with
# "PDO-mappable control gains"; the objects for those gains are not documented
# there. Ask robotics@maxongroup.com for the HEJ object dictionary.
#
# Values below were read from the drive itself (SDO, 2026-09-29):
#   vendor 0x000000FB, product 0x8A020045, rev 0x01610110, serial 704643205
#   gear 18:1 (0x3003), main position sensor 16384 inc/rev (0x3000:05, SSI)
#   motor encoder 20480 inc/rev, Hall sensors, dual-loop control
#
#   python -m ethercat_mc.cli info -c configs/demo_1x_hej70.yaml
#   python demo.py -c configs/demo_1x_hej70.yaml

bus:
  # The TwinCAT-Intel PCI Ethernet Adapter. Stop TwinCAT (or set the
  # TwinCAT3 System Service to Manual) for reliable mailbox traffic.
  adapter: '\Device\NPF_{F7C77A8E-B845-460F-9552-BB8D10CB303A}'
  # 4 ms: at 2 ms the EPOS4 reported EtherCAT communication errors (0x8180)
  # and dropped out of OP on this Windows host; at 4 ms it ran clean.
  cycle_time_s: 0.004
  use_dc: false
  pdo_timeout_us: 2000
  max_wkc_errors: 50

axes:
  - name: hej70
    driver: maxon
    slave_position: 0

    vendor_id: 0x000000FB       # Maxon, confirmed on the bus
    product_code: 0x8A020045    # EPOS4 in the HEJ 70

    # Confirmed by the datasheet (HEJ 70-48-60 rev 1.0): the 14-bit absolute
    # joint sensor "measures the absolute output position (after the gear)",
    # so these are OUTPUT-shaft counts and gear_ratio stays 1.0. The 18:1
    # gear in 0x3003 is already inside them.
    counts_per_rev: 16384
    gear_ratio: 1.0
    direction: 1
    zero_offset_counts: 0

    default_mode: csp

    # The datasheet gives 0.5 deg average mechanical backlash, and moves were
    # measured settling 0.04-0.31 deg from the goal, so 0.05 deg can never be
    # reached. Lower this only with a low-backlash HEJ variant.
    position_tolerance_deg: 0.5

    limits:
      min_deg: -180.0
      max_deg: 180.0
      max_velocity_deg_s: 30.0
      max_acceleration_deg_s2: 60.0
      max_step_deg: 180.0
      # 5 deg is ~227 counts; also written to the drive (0x6065), which was
      # 2000 counts (~44 deg) from the factory.
      max_following_error_deg: 5.0
      max_torque_permille: 300

    homing:
      # The SSI encoder is absolute; the demo zeroes at the current pose.
      enabled: false
      method: 37
      timeout_s: 30.0
